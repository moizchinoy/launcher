<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/hammer.svg">
    <style>
        :root {
            --bg-main: #0b0f19;       /* Deep obsidian dark background */
            --bg-panel: #1f2937;      /* Solid slate search card */
            --bg-darker: #111827;     /* Clean dark footer */
            --border-color: #374151;  /* Subtle panel division border */
            --text-main: #f9fafb;     /* High contrast white titles */
            --text-muted: #d1d5db;    /* Soft gray category text */
            --text-dim: #9ca3af;      /* Secondary description tags */
            --accent-color: #10b981;   /* Smooth emerald green accent */
            --accent-bg: rgba(16, 185, 129, 0.15);
            --highlight-bg: rgba(251, 191, 36, 0.25); /* Translucent gold badge fill */
            --highlight-txt: #fde047;                  /* Bright neon yellow character tint */
        }

        /* 1. Dracula Theme (Sleek Dark Purple) */
        body[data-theme="dracula"] {
            --bg-main: #282a36;
            --bg-panel: #44475a;
            --bg-darker: #191a21;
            --border-color: #6272a4;
            --text-main: #f8f8f2;
            --text-muted: #f8f8f2;
            --text-dim: #6272a4;
            --accent-color: #bd93f9;
            --accent-bg: rgba(189, 147, 249, 0.15);
            --highlight-bg: rgba(255, 121, 198, 0.3); /* Translucent hot pink */
            --highlight-txt: #ff79c6;
        }

        /* 2. Monokai Theme (Classic Retro Dev Dark) */
        body[data-theme="monokai"] {
            --bg-main: #272822;
            --bg-panel: #3e3d32;
            --bg-darker: #1e1f1c;
            --border-color: #75715e;
            --text-main: #f8f8f2;
            --text-muted: #f8f8f2;
            --text-dim: #75715e;
            --accent-color: #a6e22e;
            --accent-bg: rgba(166, 226, 46, 0.15);
            --highlight-bg: rgba(249, 38, 114, 0.3); /* Translucent vivid red-pink */
            --highlight-txt: #f92672;
        }

        /* 3. GitHub Light Theme (Clean Professional Light Mode) */
        body[data-theme="github-light"] {
            --bg-main: #f6f8fa;
            --bg-panel: #ffffff;
            --bg-darker: #eaeef2;
            --border-color: #d0d7de;
            --text-main: #24292f;
            --text-muted: #57606a;
            --text-dim: #8c959f;
            --accent-color: #0969da;
            --accent-bg: rgba(9, 105, 218, 0.1);
            --highlight-bg: rgba(255, 211, 61, 0.4);  /* Clean highlighter yellow marker */
            --highlight-txt: #b45309;
        }

        /* 4. Minimalist Light Theme Option */
        body[data-theme="light"] {
            --bg-main: #f3f4f6;
            --bg-panel: #ffffff;
            --bg-darker: #e5e7eb;
            --border-color: #d1d5db;
            --text-main: #111827;
            --text-muted: #4b5563;
            --text-dim: #6b7280;
            --accent-color: #10b981;
            --accent-bg: rgba(16, 185, 129, 0.1);
            --highlight-bg: rgba(245, 158, 11, 0.25); /* Warm amber tint background marker */
            --highlight-txt: #b45309;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #themeSelector {
            background: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 24px;
            font-family: inherit;
        }

        .landing-zone { text-align: center; }
        .landing-title { font-size: 3.25rem; font-weight: 800; color: var(--text-dim); margin-bottom: 16px; }
        .landing-tip { color: var(--text-dim); font-size: 1.25rem; }

        kbd {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            font-size: 1.0rem;
            color: var(--text-main);
        }

        .status-badge {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.0rem;
            font-family: monospace;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
        }
        .status-success { background-color: var(--accent-bg); border-color: var(--accent-color); color: var(--text-main); }
        .status-error { background-color: rgba(220, 38, 38, 0.15); border-color: #dc2626; color: #f87171; text-align: left; max-width: 500px; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: start;
            justify-content: center;
            padding-top: 15vh;
            z-index: 50;
        }
        .hidden { display: none !important; }

        .search-panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 650px;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .search-header {
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(0,0,0,0.03);
        }
        .search-icon { font-size: 1.25rem; margin-right: 12px; color: var(--text-dim); }
        .search-input {
            width: 100%;
            padding: 16px 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 1.3rem;
        }
        .search-input::placeholder { color: var(--text-dim); }

        .item-counter {
            font-size: 0.85rem;
            font-family: monospace;
            color: var(--text-dim);
            background-color: var(--bg-darker);
            padding: 4px 8px;
            border-radius: 4px;
            margin-left: 8px;
            white-space: nowrap;
        }

        .results-list {
            max-height: 350px;
            overflow-y: auto;
            padding: 8px;
        }
        .results-list::-webkit-scrollbar { width: 6px; }
        .results-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .row-item {
            display: flex;
            flex-direction: column;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            border-left: 4px solid transparent;
            margin-bottom: 2px;
        }
        .row-item:hover { background-color: rgba(0, 0, 0, 0.02); }
        .row-item.active {
            background-color: var(--accent-bg);
            border-left-color: var(--accent-color);
        }

        .row-title { font-size: 1.1rem; font-weight: 500; color: var(--text-main); }
        .row-item.active .row-title { color: var(--text-main); }
        .row-url { font-size: 0.95rem; color: var(--text-dim); font-family: monospace; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* The Fix: Matches raw title line-scale identically, using a clean rounded badge marker instead of a text resize */
        .highlight-char {
            background-color: var(--highlight-bg);
            color: var(--highlight-txt);
            font-weight: 700;
            padding: 1px 3px;
            margin: 0 1px;
            border-radius: 4px;
        }

        .search-footer {
            padding: 8px 16px;
            background-color: var(--bg-darker);
            font-size: 14px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            font-family: monospace;
        }
        .highlight-green { color: var(--accent-color); }
        .highlight-red { color: #f87171; }
    </style>
</head>
<body>

    <select id="themeSelector" style="background: var(--bg-darker); color: var(--text-main); border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 1.1rem; outline: none;">
        <option value="default">Default Dark 🌌</option>
        <option value="light">Light ☀️</option>
        <option value="dracula">Dracula 🧛</option>
        <option value="monokai">Monokai 🕹️</option>
        <option value="github-light">GitHub Light 🐙</option>
    </select>

    <div class="landing-zone">
        <h1 class="landing-title">Welcome</h1>
        <p class="landing-tip">Press <kbd>/</kbd> to search bookmarks</p>
        <div id="statusMessage" class="status-badge">
            🔄 Loading bookmarks from Python server...
        </div>
    </div>

    <div id="searchModal" class="modal-overlay hidden">
        <div class="search-panel">
            <div class="search-header">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search bookmarks..." class="search-input" autocomplete="off">
                <span id="itemCounter" class="item-counter">0/0</span>
            </div>
            <div id="resultsList" class="results-list"></div>
            <div class="search-footer">
                <div><span class="highlight-green">↑↓</span> Navigate • <span class="highlight-green">Enter</span> Open • <span class="highlight-green">Ctrl/Cmd+Enter</span> New Tab</div>
                <div><span class="highlight-red">ESC</span> Close</div>
            </div>
        </div>
    </div>

    <script>
        let flatBookmarks = [];
        let searchResults = [];
        let selectedIndex = -1;

        const modal = document.getElementById('searchModal');
        const input = document.getElementById('searchInput');
        const list = document.getElementById('resultsList');
        const counter = document.getElementById('itemCounter');
        const statusMessage = document.getElementById('statusMessage');

        function nativeFuzzyMatch(query, items) {
            if (!query) return items;

            var cleanQuery = query.toLowerCase().replace(/\s+/g, '');
            var scoredItems = items.map(function(item) {
                var text = item.displayName.toLowerCase();
                var score = 0;
                var queryIdx = 0;

                for (var i = 0; i < text.length && queryIdx < cleanQuery.length; i++) {
                    if (text[i] === cleanQuery[queryIdx]) {
                        score += (10 - Math.min(i, 5));
                        queryIdx++;
                    }
                }

                if (text.indexOf(query.toLowerCase()) !== -1) {
                    score += 50;
                }

                return { item: item, matches: queryIdx === cleanQuery.length, score: score };
            });

            return scoredItems
                .filter(function(res) { return res.matches; })
                .sort(function(a, b) { return b.score - a.score; })
                .map(function(res) { return res.item; });
        }

        async function loadBookmarks() {
            try {
                var response = await fetch('bookmarks.json?v=' + Date.now());
                if (!response.ok) throw new Error('HTTP Error Status: ' + response.status);

                var text = await response.text();
                var data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error('JSON structural parse crash: ' + e.message);
                }

                flatBookmarks = [];
                data.forEach(function(group) {
                    var category = group.category || '';
                    if (group.links && Array.isArray(group.links)) {
                        group.links.forEach(function(link) {
                            var displayName = category.length > 0 ? (category + ' - ' + link.name) : link.name;
                            flatBookmarks.push({ displayName: displayName, url: link.url });
                        });
                    }
                });

                searchResults = flatBookmarks.slice();
                renderResults();

                statusMessage.className = "status-badge status-success";
                statusMessage.innerHTML = "✅ Loaded <b>" + flatBookmarks.length + "</b> local bookmarks natively!";
            } catch (err) {
                statusMessage.className = "status-badge status-error";
                statusMessage.innerHTML = "❌ <b>Error:</b> " + err.message;
                console.error(err);
            }
        }

        function renderResults() {
            if (searchResults.length === 0) {
                list.innerHTML = '<div style="padding:16px;color:#6b7280;text-align:center;font-size:14px;">No matches found</div>';
                counter.textContent = '0/' + flatBookmarks.length;
                return;
            }

            counter.textContent = searchResults.length + '/' + flatBookmarks.length;
            list.innerHTML = '';

            var query = input.value.trim().toLowerCase().replace(/\s+/g, '');

            searchResults.forEach(function(item, index) {
                var isCurrent = selectedIndex >= 0 && index === selectedIndex;

                var itemDiv = document.createElement('div');
                itemDiv.className = 'row-item ' + (isCurrent ? 'active' : '');

                var titleSpan = document.createElement('span');
                titleSpan.className = 'row-title';

                // --- CHARACTER LEVEL HIGHLIGHTING ENGINE ---
                if (query) {
                    var text = item.displayName;
                    var highlightedHtml = '';
                    var queryIdx = 0;

                    for (var i = 0; i < text.length; i++) {
                        if (queryIdx < query.length && text[i].toLowerCase() === query[queryIdx]) {
                            highlightedHtml += '<span class="highlight-char">' + text[i] + '</span>';
                            queryIdx++;
                        } else {
                            highlightedHtml += text[i];
                        }
                    }
                    titleSpan.innerHTML = highlightedHtml;
                } else {
                    titleSpan.textContent = item.displayName;
                }
                // -------------------------------------------

                var urlSpan = document.createElement('span');
                urlSpan.className = 'row-url';
                urlSpan.textContent = '🔗 ' + item.url;

                itemDiv.appendChild(titleSpan);
                itemDiv.appendChild(urlSpan);

                itemDiv.onclick = function(e) {
                    var target = (e.ctrlKey || e.metaKey) ? '_blank' : '_self';
                    window.open(item.url, target);
                    input.focus();
                };
                list.appendChild(itemDiv);
            });

            var activeEl = list.children[selectedIndex];
            if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
        }

        input.oninput = function() {
            searchResults = nativeFuzzyMatch(input.value.trim(), flatBookmarks);
            selectedIndex = -1;
            renderResults();
        };

        window.onkeydown = function(e) {
            if (e.key === '/' && modal.classList.contains('hidden')) {
                e.preventDefault();
                modal.classList.remove('hidden');
                input.focus();
                input.value = '';
                searchResults = flatBookmarks.slice();
                selectedIndex = -1;
                renderResults();
                return;
            }

            if (modal.classList.contains('hidden')) return;

            if (e.key === 'Escape') {
                modal.classList.add('hidden');
                input.blur();
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (searchResults.length > 0) {
                    // If we are at the very bottom item, wrap back to unselected (-1)
                    if (selectedIndex === searchResults.length - 1) {
                        selectedIndex = -1;
                    } else {
                        selectedIndex++;
                    }
                    renderResults();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (searchResults.length > 0) {
                    // If we are at the very top item (0), move up to unselected (-1)
                    if (selectedIndex === 0) {
                        selectedIndex = -1;
                    } else if (selectedIndex === -1) {
                        // If currently unselected, ArrowUp wraps clean to the bottom item
                        selectedIndex = searchResults.length - 1;
                    } else {
                        selectedIndex--;
                    }
                    renderResults();
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (selectedIndex >= 0 && searchResults[selectedIndex]) {
                    var target = e.ctrlKey ? '_blank' : '_self';
                    window.open(searchResults[selectedIndex].url, target);
                }
                // Kept open! We just force focus back onto the input field
                // so you can immediately type your next query
                input.focus();
                renderResults();
            }
        };

        window.onclick = function(e) {
            if (e.target === modal) {
                modal.classList.add('hidden');
                input.blur();
            }
        };

        window.addEventListener('DOMContentLoaded', loadBookmarks);

        const themeSelector = document.getElementById('themeSelector');

        // 1. Read and load the saved theme from memory on startup
        const savedTheme = localStorage.getItem('theme') || 'default';
        themeSelector.value = savedTheme;
        if (savedTheme !== 'default') {
            document.body.setAttribute('data-theme', savedTheme);
        }

        // 2. Listen for theme alterations
        themeSelector.onchange = function() {
            const selectedTheme = themeSelector.value;

            if (selectedTheme === 'default') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', selectedTheme);
            }

            // Save state natively to memory
            localStorage.setItem('theme', selectedTheme);
            input.focus(); // Prevent losing text control input context
        };

    </script>
</body>
</html>
